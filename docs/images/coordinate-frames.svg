<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#78c7fa"/></marker></defs>
<rect width="1160" height="390" fill="#101820"/>
<text x="35" y="42" fill="#edf5fb" font-family="sans-serif" font-size="25" font-weight="bold">Measured transforms: no planar pose substitution</text>
<rect x="30" y="90" width="330" height="180" rx="12" fill="#1b3040" stroke="#50758d"/>
<text x="50" y="124" fill="#8bd1ff" font-family="sans-serif" font-size="21" font-weight="bold">CARLA world</text>
<text x="50" y="156" fill="#e4edf3" font-family="sans-serif" font-size="18">World geometry in metres</text>
<text x="50" y="183" fill="#e4edf3" font-family="sans-serif" font-size="18">Road-local elevation / XYZ</text>
<text x="50" y="210" fill="#e4edf3" font-family="sans-serif" font-size="18">Optical-to-world: measured</text>
<text x="50" y="237" fill="#e4edf3" font-family="sans-serif" font-size="18">No global XY union</text>
<rect x="415" y="90" width="330" height="180" rx="12" fill="#1b3040" stroke="#50758d"/>
<text x="435" y="124" fill="#8bd1ff" font-family="sans-serif" font-size="21" font-weight="bold">BEV model local</text>
<text x="435" y="156" fill="#e4edf3" font-family="sans-serif" font-size="18">x: right; y: forward; z: up</text>
<text x="435" y="183" fill="#e4edf3" font-family="sans-serif" font-size="18">Full world-to-BEV 4x4</text>
<text x="435" y="210" fill="#e4edf3" font-family="sans-serif" font-size="18">Default 30 x 60 m ROI</text>
<text x="435" y="237" fill="#e4edf3" font-family="sans-serif" font-size="18">Default ego z: [-2, 2] m</text>
<rect x="800" y="90" width="330" height="180" rx="12" fill="#1b3040" stroke="#50758d"/>
<text x="820" y="124" fill="#8bd1ff" font-family="sans-serif" font-size="21" font-weight="bold">Camera optical</text>
<text x="820" y="156" fill="#e4edf3" font-family="sans-serif" font-size="18">x: right; y: down; z: forward</text>
<text x="820" y="183" fill="#e4edf3" font-family="sans-serif" font-size="18">Measured K and extrinsics</text>
<text x="820" y="210" fill="#e4edf3" font-family="sans-serif" font-size="18">Depth: optical z in metres</text>
<text x="820" y="237" fill="#e4edf3" font-family="sans-serif" font-size="18">Project full XYZ per camera</text>
<path d="M360 180 L405 180" stroke="#78c7fa" stroke-width="3" marker-end="url(#a)" fill="none"/>
<path d="M745 180 L790 180" stroke="#78c7fa" stroke-width="3" marker-end="url(#a)" fill="none"/>
